name: 缺陷报告
description: 报告 mihomo 脚本的安装或使用问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：已阅读 README，且 `bash tests/smoke.sh` 在本地通过。
        请勿粘贴订阅链接、节点地址、UUID、密码等敏感信息。

  - type: input
    id: script-version
    attributes:
      label: 脚本版本
      description: 执行 `bash install.sh --version` 或查看文件头 `# ver`
      placeholder: "2.6.2-beta"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 脚本通道
      description: 安装时使用的脚本通道；菜单状态区「脚本通道」也会显示
      options:
        - 正式版 main
        - 测试版 beta
        - 不确定
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 发行版与架构
      placeholder: "Debian 12 / x86_64"
    validations:
      required: true

  - type: input
    id: kernel-channel
    attributes:
      label: 内核通道
      description: 安装时选择的 `--channel`，或切换后的通道
      placeholder: "stable / alpha"

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 curl ... | bash
        2. 选择 1 安装正式版
        3. 菜单选 4 启动
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与报错
      description: 请粘贴关键报错；日志可用菜单第 11 项查看，注意脱敏
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关配置片段（脱敏后）、是否可用 `--channel alpha` 复现等
